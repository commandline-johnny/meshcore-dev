name: PR Build Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          # LilyGo T-Deck
          - LilyGo_TDeck_companion_radio_usb
          - LilyGo_TDeck_companion_radio_ble
          - LilyGo_TDeck_repeater
          # Meshnology W12
          - meshnology_w12_companion_radio_usb
          - meshnology_w12_companion_radio_ble
          - meshnology_w12_companion_radio_wifi
          - meshnology_w12_repeater
          - meshnology_w12_room_server

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
